<!DOCTYPE html>

<head>

<style>
:root{--bg:#05070B;--p:#168BFF;--p2:#0A4FB8;--l:#6CB9FF;--g:#8A94A6;--ok:#34D399;--wt:#FBBF24;--er:#FF5C7A;--bd:rgba(22,139,255,.28)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);pointer-events:none}
body:before{background:#168BFF;top:-130px;right:-110px;opacity:.35}body:after{background:#0A4FB8;bottom:-150px;left:-130px;opacity:.3}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 16px calc(98px + env(safe-area-inset-bottom))}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:900;font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,#fff,var(--l) 50%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(22,139,255,.7))}
.tag{font-size:10px;font-weight:800;color:#05070B;background:var(--p);border-radius:6px;padding:1px 6px;margin-left:6px;-webkit-text-fill-color:#05070B}
.sp{flex:1}.g{color:var(--g);font-size:13px}
.chip{font-size:11px;background:rgba(0,0,0,.45);border:1px solid var(--bd);border-radius:10px;padding:3px 9px;white-space:nowrap}.dm{color:var(--wt);border-color:rgba(251,191,36,.4)}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--p);background:#0b1426;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;box-shadow:0 0 14px rgba(22,139,255,.55)}.av img{width:100%;height:100%;object-fit:cover}
.h1{font-size:22px;margin-bottom:12px}h2{font-size:15px;margin:18px 0 10px}
.greet{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hero{background:linear-gradient(135deg,rgba(10,79,184,.7),rgba(22,139,255,.35));border-color:rgba(108,185,255,.5);box-shadow:0 0 34px rgba(22,139,255,.35)}
.g2c{display:flex;align-items:center;gap:8px;color:#cfe4ff;font-size:13px}.big{font-size:36px;font-weight:900;letter-spacing:-1px;margin:4px 0 12px}.big small{font-size:15px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{margin:0 0 12px;animation:pop .5s both}.stat b{font-size:22px;display:inline-block;margin-right:4px}.stat span{font-size:12px;color:var(--g)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:46px;font:700 14px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--p),#3aa0ff);cursor:pointer;box-shadow:0 4px 18px rgba(22,139,255,.45);transition:transform .12s,box-shadow .2s,opacity .2s;flex:1}
.btn:active{transform:scale(.95);box-shadow:0 0 28px rgba(22,139,255,.8)}.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--bd)}.btn.pri{background:linear-gradient(135deg,#2da0ff,#168BFF 55%,#0A6FE0)}
.btn.w{width:100%;flex:none}.btn.lg{min-height:54px;font-size:16px;margin-bottom:6px}.btn[disabled]{opacity:.4;pointer-events:none}.btn.er{background:rgba(255,92,122,.15);color:var(--er);border:1px solid rgba(255,92,122,.4);box-shadow:none}
.row{display:flex;gap:10px;margin-top:12px}.item{display:flex;align-items:center;gap:12px}
.note{background:rgba(22,139,255,.1);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;font-size:13px;color:#cfe4ff;margin:10px 0}.note.wn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35);color:#fde9a8}.note.rj{background:rgba(255,92,122,.08);border-color:rgba(255,92,122,.4);color:#ffc2cd}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--g);font:600 13px inherit;font-family:inherit;border-radius:20px;padding:8px 14px;cursor:pointer;transition:all .2s}.chips .on{background:var(--p);color:#fff;box-shadow:0 0 16px rgba(22,139,255,.6)}
.cc{cursor:pointer;transition:transform .15s,border-color .2s}.cc:active{transform:scale(.98);border-color:var(--l)}
.ic{width:44px;height:44px;border-radius:14px;background:rgba(22,139,255,.15);border:1px solid var(--bd);display:grid;place-items:center;font-size:21px;flex:none}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 8px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--l));border-radius:6px;box-shadow:0 0 10px var(--p);animation:gw .8s both}@keyframes gw{from{width:0!important}}
.g2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--g)}.g2 b{color:#fff}
.bd{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}.bd.ok{background:rgba(52,211,153,.15);color:var(--ok)}.bd.wt{background:rgba(251,191,36,.15);color:var(--wt)}.bd.gr{background:rgba(138,148,166,.18);color:#c3cad6}.bd.bl{background:rgba(22,139,255,.2);color:var(--l)}.bd.er{background:rgba(255,92,122,.15);color:var(--er)}
.chart{width:100%;height:auto;display:block}.bar-r{transform-origin:bottom;transform-box:fill-box;animation:grow .7s both}@keyframes grow{from{transform:scaleY(0)}}
.steps{display:flex;gap:5px}.steps i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.1);transition:background .3s}.steps .d{background:var(--p)}.steps .c{background:var(--l);box-shadow:0 0 10px var(--p)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tc{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:16px;padding:14px 8px;color:#fff;font:600 13px inherit;font-family:inherit;cursor:pointer;display:grid;gap:6px;justify-items:center;transition:all .2s}.tc span{font-size:26px}.tc.on{background:rgba(22,139,255,.25);border-color:var(--l);box-shadow:0 0 20px rgba(22,139,255,.5)}
.lb{display:block;font-size:13px;color:var(--g);margin:2px 0 6px}.inp{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--bd);border-radius:12px;color:#fff;font:600 16px inherit;font-family:inherit;padding:12px;min-height:48px;margin-bottom:6px;outline:0;transition:border-color .2s,box-shadow .2s}.inp:focus{border-color:var(--l);box-shadow:0 0 14px rgba(22,139,255,.45)}.ta{min-height:110px;resize:vertical}
.err{color:var(--er);font-size:13px;margin:2px 0 8px}.err a{color:var(--l);text-decoration:underline;cursor:pointer}.hint{margin-bottom:8px;font-size:12px}
.sum .item{justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);align-items:flex-start}.sum b{text-align:right;word-break:break-word;max-width:62%;font-size:14px}.sum .g{flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:12px 0 6px}.chk input{width:20px;height:20px;accent-color:var(--p);flex:none}
.tr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.tr:last-child{border:0}.tr b.p{color:var(--ok)}.tr b.m{color:var(--er)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}.kv:last-child{border:0}.kv b{text-align:right;word-break:break-word}
.ml{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}.ml:first-child{border:0}
.sw{width:46px;height:26px;border-radius:20px;background:#2a3550;position:relative;border:0;flex:none;cursor:pointer;transition:background .2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--p);box-shadow:0 0 12px var(--p)}.sw.on:after{transform:translateX(20px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(5,7,11,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav div{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--g);font:600 10px inherit;font-family:inherit;display:grid;justify-items:center;gap:3px;padding:6px 2px;min-height:52px;border-radius:14px;cursor:pointer;transition:all .2s}nav .on{color:var(--l);background:rgba(22,139,255,.18);box-shadow:0 0 16px rgba(22,139,255,.5)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}nav .mid svg{width:26px;height:26px;background:linear-gradient(135deg,var(--p),#3aa0ff);color:#fff;border-radius:10px;padding:3px;box-shadow:0 0 16px rgba(22,139,255,.8)}
.sub{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;padding:10px 16px 40px;animation:up .28s}.sub>div{max-width:560px;margin:0 auto}.back{background:none;border:0;color:var(--l);font:700 15px inherit;font-family:inherit;padding:10px 0;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;align-items:end;animation:fd .2s}.ov .bx{max-width:560px;width:100%;margin:0 auto;background:#0a1020;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--bd);animation:up .28s;max-height:88vh;overflow:auto}.ov h3{margin-bottom:8px}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-140px);z-index:60;background:#0d1a33;border:1px solid var(--bd);border-left:4px solid var(--ok);padding:11px 16px;border-radius:14px;max-width:90%;font-size:14px;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.5)}#toast.show{transform:translate(-50%,0)}#toast.er{border-left-color:var(--er)}
.view{animation:up .32s}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes fd{from{opacity:0}}
.sk{height:92px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,#0b1426 30%,#16284a 50%,#0b1426 70%);background-size:300% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-100% 0}}
.empty{text-align:center;padding:30px 10px;color:var(--g)}.empty i{font-style:normal;font-size:34px;display:block}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--l);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav><div id="nav"></div></nav>
<div id="toast"></div>
<div id="ly"></div>
<script>
"use strict";
/* SPAMLESS ADS — reklamachi Mini App frontendi.
   Bo‘limlar: 1 Sozlamalar · 2 Demo ma’lumot · 3 Yordamchilar · 4 Server · 5 Sahifalar ·
              6 Reklama yaratish · 7 Hamyon, profil, oynalar · 8 Navigatsiya
   Backendda hozir faqat /health, /auth/telegram, /me mavjud. Reklamachi endpointlari YO‘Q,
   shuning uchun kampaniya, hamyon va to‘lov qismlari DEMO (xotirada, saqlanmaydi). */

/* ===== 1. SOZLAMALAR ===== */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#05070B"); tg.setBackgroundColor("#05070B"); } catch (e) {} }
const CFG = { ver: "1.0.0-demo", minBudget: 10000, minTarget: 10, support: "spamless_support" }; // minimal chegaralar DEMO; haqiqiysini backend belgilaydi
const TYPES = {
  sub: { n: "Kanalga obuna", ic: "📢", unit: "obuna", ph: "https://t.me/kanal_nomi yoki @kanal_nomi",
    chk: "Obuna Telegram Bot API orqali tekshiriladi. Buning uchun SPAMLESS boti kanalingizda administrator bo‘lishi kerak." },
  bot: { n: "Botni ishga tushirish", ic: "🤖", unit: "start", ph: "https://t.me/bot_nomi_bot",
    chk: "Foydalanuvchi birinchi marta /start bosganini backend tekshiradi." },
  app: { n: "Ilovani o‘rnatish", ic: "📱", unit: "o‘rnatish", ph: "https://play.google.com/store/apps/details?id=...",
    chk: "O‘rnatish faqat ishonchli install-attribution orqali tasdiqlanadi. Havolani bosish o‘rnatish emas." },
  video: { n: "Video ko‘rish", ic: "🎬", unit: "ko‘rish", ph: "https://sayt.uz/video.mp4",
    chk: "Natija video to‘liq ko‘rilganini backend tasdiqlagandagina hisoblanadi." },
  link: { n: "Havolaga o‘tish", ic: "🔗", unit: "bosish", ph: "https://sizning-sayt.uz", noVerify: true,
    chk: "Havolaga bosish tasdiqlangan natija emas. Faqat bosilishlar statistikasi ko‘rsatiladi." },
};
const ST = { act: ["Faol", "ok"], rev: ["Tekshiruvda", "wt"], pau: ["To‘xtatilgan", "gr"], end: ["Yakunlangan", "bl"], rej: ["Rad etilgan", "er"] };
const LN = { all: "Hammasi", uz: "O‘zbekcha", ru: "Ruscha", en: "Inglizcha" };

/* ===== 2. DEMO MA’LUMOT (backend ulanmagan) ===== */
const D0 = new Date(), dt = o => { const d = new Date(D0); d.setDate(d.getDate() + o); return d; };
const fd = d => d.toLocaleDateString("ru-RU");
const Z = [0, 0, 0, 0, 0, 0, 0];
const S = {
  tab: "home", flt: "all", q: "", chart: "d", wt: "pay", bal: 1250000, notif: true, weekly: false, company: "",
  camps: [
    { id: 1, name: "Texno kanal — yangi obunachilar", type: "sub", st: "act", budget: 500000, spent: 312000, target: 1000, s: -9, e: 5, lang: "uz", url: "https://t.me/texno_kanal", desc: "Texnologiya va gadjetlar yangiliklari kanali.", d: [60, 72, 85, 90, 110, 95, 112], dv: [900, 1100, 1250, 1400, 1650, 1500, 2000], dc: [120, 150, 180, 190, 230, 210, 240] },
    { id: 2, name: "Quiz Bot ishga tushirish", type: "bot", st: "act", budget: 300000, spent: 198400, target: 1500, s: -7, e: 7, lang: "all", url: "https://t.me/quiz_uz_bot", desc: "Savol-javob o‘yini boti.", d: [40, 55, 70, 66, 90, 80, 95], dv: [700, 900, 1000, 1100, 1300, 1250, 1500], dc: [90, 110, 130, 120, 160, 150, 170] },
    { id: 3, name: "FitTrack ilovasi", type: "app", st: "rev", budget: 800000, spent: 0, target: 500, s: 1, e: 15, lang: "all", url: "https://play.google.com/store/apps/details?id=demo.fittrack", desc: "Mashq va ovqatlanish ilovasi.", d: Z, dv: Z, dc: Z },
    { id: 4, name: "Mahsulot taqdimoti (video)", type: "video", st: "pau", budget: 400000, spent: 66000, target: 2000, s: -5, e: 10, lang: "ru", url: "https://sayt.uz/promo.mp4", desc: "Yangi mahsulot taqdimoti videosi.", d: [0, 0, 150, 170, 120, 0, 0], dv: [0, 0, 600, 700, 500, 0, 0], dc: Z },
    { id: 5, name: "Onlayn kurs — landing", type: "link", st: "end", budget: 200000, spent: 168000, target: 5000, s: -20, e: -3, lang: "uz", url: "https://kurs.sayt.uz", desc: "Onlayn kurs sahifasi.", d: Z, dv: [3000, 3800, 4200, 4500, 3900, 3100, 3000], dc: [450, 600, 700, 800, 650, 500, 500] },
    { id: 6, name: "Kripto signal kanali", type: "sub", st: "rej", budget: 300000, spent: 0, target: 800, s: -2, e: 12, lang: "all", url: "https://t.me/kripto_signal", desc: "Kripto signallar kanali.", reason: "Kanal mazmuni platforma qoidalariga mos kelmadi (DEMO sabab).", d: Z, dv: Z, dc: Z },
  ],
  tx: [
    { d: dt(-12), k: "topup", a: 1000000, n: "Demo to‘ldirish" }, { d: dt(-9), k: "reserve", a: -500000, n: "Budjet rezervi: Texno kanal" },
    { d: dt(-8), k: "topup", a: 500000, n: "Demo to‘ldirish" }, { d: dt(-7), k: "reserve", a: -300000, n: "Budjet rezervi: Quiz Bot" },
    { d: dt(-5), k: "topup", a: 550000, n: "Demo to‘ldirish" },
  ],
};
const W = { step: 1, type: "", name: "", url: "", desc: "", lang: "all", target: "", budget: "", agree: false, err: {} };

/* ===== 3. YORDAMCHILAR ===== */
const $ = s => document.querySelector(s);
const f = n => Number(n).toLocaleString("ru-RU").replace(/[\u00a0\u202f]/g, " ");
const sum = a => a.reduce((x, y) => x + y, 0), wait = ms => new Promise(r => setTimeout(r, ms));
const num = v => Number(String(v).replace(/ /g, ""));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badge = k => `<span class="bd ${ST[k][1]}">${ST[k][0]}</span>`;
const hap = t => { try { const h = tg && tg.HapticFeedback; if (!h) return; t === "error" ? h.notificationOccurred("error") : t === "ok" ? h.notificationOccurred("success") : h.impactOccurred("light"); } catch (e) {} };
function toast(m, e) { const x = $("#toast"); x.textContent = m; x.className = "show" + (e ? " er" : ""); clearTimeout(toast.h); toast.h = setTimeout(() => x.className = "", 3200); }
const ly = h => $("#ly").innerHTML = h, closeLy = () => ly("");
function sub(title, h) { ly(`<div class="sub"><div><button class="back" onclick="closeLy();render()">‹ Orqaga</button><h1 class="h1">${title}</h1>${h}</div></div>`); }
function modal(h) { ly(`<div class="ov" onclick="if(event.target===this)closeLy()"><div class="bx">${h}</div></div>`); }
function info(a, b) { modal(`<h3>${a}</h3><p class="g" style="margin:8px 0 16px">${b}</p><button class="btn w" onclick="closeLy()">Yopish</button>`); }
function counters() {
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  document.querySelectorAll(".cn").forEach(el => {
    const to = +el.dataset.v; if (still) { el.textContent = f(to); return; }
    const t0 = performance.now();
    (function s(n) { const p = Math.min((n - t0) / 900, 1); el.textContent = f(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(s); })(t0);
  });
}
function chart(vals, labels) {
  const mx = Math.max(...vals, 1), Wd = 300, H = 110, bw = 26, gap = (Wd - vals.length * bw) / (vals.length + 1);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H + 24}" role="img" aria-label="Grafik"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CB9FF"/><stop offset="1" stop-color="#168BFF" stop-opacity=".45"/></linearGradient></defs>${vals.map((v, i) => {
    const h = Math.max(v / mx * H, 2), x = gap + i * (bw + gap);
    return `<g><rect class="bar-r" style="animation-delay:${i * 60}ms" x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="6" fill="url(#cg)"/><text x="${x + bw / 2}" y="${H - h - 5}" text-anchor="middle" fill="#fff" font-size="9">${f(v)}</text><text x="${x + bw / 2}" y="${H + 15}" text-anchor="middle" fill="#8A94A6" font-size="10">${labels[i]}</text></g>`;
  }).join("")}</svg>`;
}
const DAYS = () => [-6, -5, -4, -3, -2, -1, 0].map(o => ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"][dt(o).getDay()]);

/* ===== 4. SERVER ULANISHI =====
   Faqat Telegram kirishi (auth) serverga ulangan. initData frontendda autentifikatsiya hisoblanmaydi:
   u xom holda backendga yuboriladi va imzo faqat serverda tekshiriladi. */
const SRV = { ok: false, msg: "Server tekshirilmagan", user: null };
async function bootServer() {
  if (!window.SpamlessApi) { SRV.msg = "Server moduli yuklanmadi (prototip rejimi)"; return; }
  try { await SpamlessApi.health(); } catch (e) { SRV.msg = e.message; return; }
  if (!(tg && tg.initData)) { SRV.msg = "Server ishlayapti, lekin Telegram ichida emas"; return; }
  try { const r = await SpamlessApi.auth(tg.initData); SRV.ok = true; SRV.user = r.user; SRV.msg = "Telegram kirishi serverda tasdiqlandi"; }
  catch (e) { SRV.msg = e.message; }
}
function who() {
  if (SRV.ok && SRV.user) return { n: SRV.user.first_name || "Reklamachi", u: SRV.user.username, id: SRV.user.telegram_id, v: 1 };
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; // tasdiqlanmagan — faqat ko‘rsatish uchun
  if (u) return { n: u.first_name || "Reklamachi", u: u.username, id: u.id, v: 0, ph: u.photo_url };
  return { n: "Reklamachi (demo)", u: "", id: "—", v: 0 };
}

const RX = { sub: /^(https:\/\/t\.me\/|@)[A-Za-z][A-Za-z0-9_]{4,31}$/, bot: /^(https:\/\/t\.me\/|@)[A-Za-z][A-Za-z0-9_]{1,28}[Bb][Oo][Tt]$/, https: /^https:\/\/[^\s\/]+\.[^\s\/]+(\/\S*)?$/ };
function vUrl(t, v) {
  v = v.trim(); if (!v) return "Havolani kiriting";
  if (t === "sub") return RX.sub.test(v) ? "" : "Ochiq kanal havolasi: https://t.me/nom yoki @nom";
  if (t === "bot") return RX.bot.test(v) ? "" : "Bot havolasi: https://t.me/nom_bot (username bot bilan tugaydi)";
  return RX.https.test(v) ? "" : "https:// bilan boshlanuvchi to‘g‘ri havola kiriting";
}
const fld = (label, inner, key, hint) => `<label class="lb">${label}</label>${inner}${W.err[key] ? `<div class="err">${W.err[key]}</div>` : hint ? `<div class="g hint">${hint}</div>` : ""}`;
const STEP = {
  1: () => `<div class="tg">${Object.entries(TYPES).map(([k, t]) => `<button class="tc ${W.type === k ? "on" : ""}" onclick="W.type='${k}';W.err={};render()"><span>${t.ic}</span>${t.n}</button>`).join("")}</div>${W.type ? `<div class="note">${TYPES[W.type].chk}</div>` : ""}${W.err.type ? `<div class="err">${W.err.type}</div>` : ""}`,
  2: () => fld("Reklama nomi", `<input class="inp" maxlength="60" value="${esc(W.name)}" oninput="W.name=this.value">`, "name", "3–60 belgi"),
  3: () => fld("Reklama havolasi", `<input class="inp" inputmode="url" autocapitalize="off" value="${esc(W.url)}" placeholder="${TYPES[W.type].ph}" oninput="W.url=this.value">`, "url", TYPES[W.type].n + " uchun havola") + `<div class="note">${TYPES[W.type].chk}</div>`,
  4: () => fld("Reklama tavsifi", `<textarea class="inp ta" maxlength="300" oninput="W.desc=this.value;$('#dc').textContent=this.value.length">${esc(W.desc)}</textarea>`, "desc", `10–300 belgi · <span id="dc">${W.desc.length}</span>/300`),
  5: () => fld("Auditoriya tili", `<select class="inp" onchange="W.lang=this.value">${Object.entries(LN).map(([k, n]) => `<option value="${k}" ${W.lang === k ? "selected" : ""}>${n}</option>`).join("")}</select>`, "lang", "Auditoriya sozlamasi backend ulangach hisobga olinadi (demo)")
    + fld(`Kerakli natijalar soni (${TYPES[W.type].unit})`, `<input class="inp" inputmode="numeric" value="${esc(W.target)}" oninput="W.target=this.value">`, "target", "Kamida " + CFG.minTarget + (TYPES[W.type].noVerify ? ". Bu bosishlar soni, tasdiqlangan natija emas." : "")),
  6: () => { const t = num(W.target), b = num(W.budget); return fld("Budjet (so‘m)", `<input class="inp" inputmode="numeric" value="${esc(W.budget)}" oninput="W.budget=this.value;pc()">`, "budget", "Demo minimal budjet: " + f(CFG.minBudget) + " so‘m")

  7: () => { const T = TYPES[W.type]; return `<div class="sum">${[["Turi", T.n], ["Nomi", esc(W.name)], ["Havola", esc(W.url)], ["Tavsif", esc(W.desc)], ["Auditoriya", LN[W.lang]], ["Natijalar", f(num(W.target)) + " " + T.unit], ["Budjet", f(num(W.budget)) + " so‘m"]].map(([a, b]) => `<div class="item"><span class="g">${a}</span><b>${b}</b></div>`).join("")}</div>

function create() {
  const T = ["Turni tanlang", "Nomi", "Havola", "Tavsif", "Auditoriya va natijalar", "Budjet", "Tekshirish va yuborish"];
  return `<h1 class="h1">Reklama yaratish</h1><div class="steps">${T.map((t, i) => `<i class="${i + 1 < W.step ? "d" : i + 1 === W.step ? "c" : ""}"></i>`).join("")}</div>

 <div class="row"><button class="btn ghost" ${W.step === 1 ? "disabled" : ""} onclick="wBack()">‹ Orqaga</button><button class="btn pri" onclick="wNext()">${W.step === 7 ? "Yuborish (DEMO)" : "Keyingi ›"}</button></div>`;

function pc() { const t = num(W.target), b = num(W.budget), el = $("#ppr"); if (el) el.textContent = t && b ? f(Math.round(b / t)) + " so‘m" : "—"; }
function wCheck() {
  const e = {}, s = W.step;
  if (s === 1 && !W.type) e.type = "Reklama turini tanlang";
  if (s === 2 && (W.name.trim().length < 3 || W.name.trim().length > 60)) e.name = "Nom 3–60 belgi bo‘lishi kerak";
  if (s === 3) { const m = vUrl(W.type, W.url); if (m) e.url = m; }
  if (s === 4 && (W.desc.trim().length < 10 || W.desc.trim().length > 300)) e.desc = "Tavsif 10–300 belgi bo‘lishi kerak";
  if (s === 5) { const t = num(W.target); if (!Number.isInteger(t) || t < CFG.minTarget || t > 1e6) e.target = "Natijalar soni " + CFG.minTarget + " dan 1 000 000 gacha butun son bo‘lishi kerak"; }
  if (s === 6) { const b = num(W.budget); if (!Number.isInteger(b) || b < CFG.minBudget || b > 1e9) e.budget = "Budjet " + f(CFG.minBudget) + " so‘mdan kam bo‘lmasin (butun son)"; }

  W.err = e; return !Object.keys(e).length;
}
function wNext() { if (!wCheck()) { render(); hap("error"); return; } if (W.step < 7) { W.step++; render(); window.scrollTo(0, 0); } else submit(); }
function wBack() { if (W.step > 1) { W.step--; W.err = {}; render(); window.scrollTo(0, 0); } }
function submit() {
  const b = num(W.budget), name = W.name.trim();
  S.camps.unshift({ id: Date.now(), name, type: W.type, st: "rev", budget: b, spent: 0, target: num(W.target), s: 1, e: 30, fresh: 1, lang: W.lang, url: W.url.trim(), desc: W.desc.trim(), d: [0, 0, 0, 0, 0, 0, 0], dv: [0, 0, 0, 0, 0, 0, 0], dc: [0, 0, 0, 0, 0, 0, 0] });
  S.bal -= b; S.tx.unshift({ d: new Date(), k: "reserve", a: -b, n: "Budjet rezervi: " + name });
  Object.assign(W, { step: 1, type: "", name: "", url: "", desc: "", lang: "all", target: "", budget: "", agree: false, err: {} });
