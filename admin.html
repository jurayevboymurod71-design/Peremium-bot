  return { id: "TX-" + (20400 + i * 17), k, who: k === "cost" ? "Platforma" : user ? USERS[(i * 5) % 48].n : ADVS[i % 8].n, a: { topup: 250000 + (i % 5) * 100000, reserve: 150000 + (i % 4) * 100000, spend: 20000 + (i % 6) * 15000, award: 50 + (i * 13) % 400, prem: 50000, refund: 50000, cost: 30000 + (i % 3) * 20000 }[k], o: -(i % 14), st: i % 13 === 7 ? "wt" : i % 17 === 5 ? "er" : "ok" }; })

function chart(vals, labels) {

function tkTake(id) { const t = TK.find(x => x.id === id); t.st = "rev"; audit("admin", "Murojaat ko‘rib chiqishga olindi", t.id, "Ish boshlandi"); ticketDetail(id); }
function tkReply(id) {
  const t = TK.find(x => x.id === id), m = ($("#rp").value || "").trim();
  if (m.length < 5) { $("#re").textContent = "Javob kamida 5 belgi bo‘lishi kerak"; hap("error"); return; }
  t.rep.push({ t: new Date(), m }); t.st = "ans"; audit("admin", "Murojaatga javob berildi", t.id, "Javob yozildi"); ticketDetail(id); toast("DEMO: javob saqlandi, Telegramda yuborilmadi");
}
function tkClose(id) { const t = TK.find(x => x.id === id); confirmAct({ title: "Murojaatni yopish", text: `${t.id} yopiladi.`, ok: "Yopish", run: r => { t.st = "cls"; audit("admin", "Murojaat yopildi", t.id, r); ticketDetail(id); toast("DEMO: murojaat yopildi"); } }); }

/* ===== 7. REKLAMALAR VA REKLAMACHILAR ===== */
const advName = id => ADVS.find(a => a.id === id).n, pct = c => Math.min(100, Math.round(c.spent / c.budget * 100));
const resLabel = c => c.type === "link" ? `bosishlar tasdiqlanmagan` : `<b>${f(sum(okOf(c)))}</b> / ${f(c.target)} tasdiqlangan`;
const ccard = c => `<div class="glass cc" onclick="campDetail(${c.id})"><div class="item"><div class="ic">${TYPES[c.type].ic}</div><div style="flex:1;min-width:0"><b class="ell">${esc(c.name)}</b><div class="g ell" style="font-size:12px">${esc(advName(c.adv))} · ${TYPES[c.type].n}</div></div>${bd(CST, c.st)}</div>
  <div class="bar"><b style="width:${pct(c)}%"></b></div><div class="g2"><span>Budjet <b>${f(c.budget)}</b> so‘m</span><span>${resLabel(c)}</span></div><div class="g" style="font-size:12px;margin-top:6px">Yaratilgan: ${fd(dt(c.cr))}</div></div>`;
function clistHtml() {
  const q = S.cq.trim().toLowerCase(), L = CAMPS.filter(c => (S.cfl === "all" || c.st === S.cfl) && (!q || c.name.toLowerCase().includes(q) || advName(c.adv).toLowerCase().includes(q)));
  return L.length ? L.map(ccard).join("") : empty("📭", "Kampaniya topilmadi");
}
const setAT = k => { S.at = k; render(); }, setCF = k => { S.cfl = k; render(); };
function ads() {
  const seg = chips([["c", "Kampaniyalar"], ["a", "Reklamachilar"]], S.at, "setAT");
  if (S.at === "a") return `<h1 class="h1">Reklamachilar</h1>${seg}${ADVS.map(arowAdv).join("")}`;
  const pend = CAMPS.filter(c => c.st === "rev").length;
  return `<h1 class="h1">Reklamalar</h1>${seg}<input class="inp" placeholder="Kampaniya yoki reklamachi nomi" aria-label="Qidirish" value="${esc(S.cq)}" oninput="S.cq=this.value;$('#cl').innerHTML=clistHtml()">
  ${chips([["all", "Hammasi"], ...Object.entries(CST).map(([k, v]) => [k, v[0] + (k === "rev" && pend ? " (" + pend + ")" : "")])], S.cfl, "setCF")}<div id="cl">${clistHtml()}</div>`;
}
function campDetail(id) {
  const c = CAMPS.find(x => x.id === id), T = TYPES[c.type], ok = sum(okOf(c)), a = ADVS.find(x => x.id === c.adv), ck = S.chk[id] || (S.chk[id] = [false, false, false, false]);
  const au = S.aud.filter(x => x.tgt === c.name);
  const btn = c.st === "rev" ? `<button class="btn pri w" style="margin-bottom:10px" onclick="apprC(${id})">Tasdiqlash</button><button class="btn er w" onclick="rejC(${id})">Rad etish</button>`
    : c.st === "act" || c.st === "apr" ? `<button class="btn er w" onclick="pauC(${id})">Vaqtincha to‘xtatish</button>` : c.st === "pau" ? `<button class="btn pri w" onclick="resC(${id})">Davom ettirish</button>` : "";
  sub(esc(c.name), `<div class="glass"><div class="item"><div class="ic">${T.ic}</div><div style="flex:1"><b>${T.n}</b><div class="g">${esc(a.n)} · ${fd(dt(c.cr))}</div></div>${bd(CST, c.st)}</div><div class="bar"><b style="width:${pct(c)}%"></b></div><div class="g2"><span>Sarflandi <b>${f(c.spent)}</b> so‘m</span><span>Budjet <b>${f(c.budget)}</b> so‘m</span></div></div>
  ${c.reason ? `<div class="note rj"><b>Rad etish sababi:</b> ${esc(c.reason)}</div>` : ""}
  ${kv([["Reklamachi", esc(a.n)], ["Havola", esc(c.url)], ["Tavsif", esc(c.desc)], ["Kerakli natijalar", f(c.target)], ["Tasdiqlangan natijalar", c.type === "link" ? "— (bosish natija emas)" : f(ok)], ["Ko‘rishlar", f(sum(c.dv))]])}
  <div class="note">${T.chk}</div>
  ${c.st === "rev" ? `<h2>Xavfsizlik va qoidalarga moslik tekshiruvi</h2><div class="glass">${CHK.map((t, i) => `<label class="chk"><input type="checkbox" ${ck[i] ? "checked" : ""} onchange="S.chk[${id}][${i}]=this.checked"> ${t}</label>`).join("")}</div>` : ""}
  ${c.st === "apr" ? '<div class="note">Tasdiqlangan reklama boshlanish sanasida faollashishi backend vazifasi. Demo: holat o‘zgarmaydi.</div>' : ""}
  <h2>Kunlik ko‘rishlar</h2><div class="glass">${chart(c.dv, DAYS())}</div>
  ${au.length ? `<h2>Qarorlar tarixi</h2><div class="glass">${au.map(arow).join("")}</div>` : ""}${btn}`);
}
function apprC(id) {
  const c = CAMPS.find(x => x.id === id);
  if (!S.chk[id].every(Boolean)) { toast("Avval barcha tekshiruv bandlarini belgilang", 1); hap("error"); return; }
  confirmAct({ title: "Reklamani tasdiqlash", text: "Xavfsizlik va platforma qoidalariga moslik tekshirilgan.", ok: "Tasdiqlash", run: r => { c.st = "apr"; audit("ad", "Reklama tasdiqlandi", c.name, r); campDetail(id); toast("DEMO: reklama tasdiqlandi"); } });
}
function rejC(id) { const c = CAMPS.find(x => x.id === id); confirmAct({ title: "Reklamani rad etish", text: "Rad etish sababi reklamachiga ko‘rsatiladi.", danger: 1, ok: "Rad etish", run: r => { c.st = "rej"; c.reason = r; audit("ad", "Reklama rad etildi", c.name, r); campDetail(id); toast("DEMO: reklama rad etildi"); } }); }
function pauC(id) { const c = CAMPS.find(x => x.id === id); confirmAct({ title: "Reklamani to‘xtatish", text: "Kampaniya vaqtincha to‘xtatiladi.", danger: 1, ok: "To‘xtatish", run: r => { c.st = "pau"; audit("ad", "Reklama to‘xtatildi", c.name, r); campDetail(id); toast("DEMO: reklama to‘xtatildi"); } }); }
function resC(id) { const c = CAMPS.find(x => x.id === id); confirmAct({ title: "Davom ettirish", text: "Kampaniya qayta faollashtiriladi.", ok: "Davom ettirish", run: r => { c.st = "act"; audit("ad", "Reklama davom ettirildi", c.name, r); campDetail(id); toast("DEMO: reklama faollashtirildi"); } }); }
const advStats = a => { const L = CAMPS.filter(c => c.adv === a.id); return { n: L.length, act: L.filter(c => c.st === "act").length, sp: sum(L.map(c => c.spent)), L }; };
const arowAdv = a => { const s = advStats(a); return `<div class="glass cc" onclick="advDetail(${a.id})"><div class="item"><div class="av sm">${esc(a.n[0])}</div><div style="flex:1;min-width:0"><b class="ell">${esc(a.n)}</b><div class="g ell" style="font-size:12px">${esc(a.co)} · ID ${a.tg}</div></div>${bd(AST, a.st)}</div><div class="g2" style="margin-top:8px"><span>Kampaniyalar <b>${s.n}</b> (faol ${s.act})</span><span>Sarflagan <b>${f(s.sp)}</b> so‘m</span></div></div>`; };
function advDetail(id) {
  const a = ADVS.find(x => x.id === id), s = advStats(a), au = S.aud.filter(x => x.tgt === a.n);
  sub(esc(a.n), `${kv([["Nomi", esc(a.n)], ["Telegram ID", a.tg], ["Kompaniya", esc(a.co)], ["Jami kampaniyalar", s.n], ["Faol kampaniyalar", s.act], ["Jami sarflagan", f(s.sp) + " so‘m"], ["Hisob holati", AST[a.st][0]]])}
  ${a.st === "chk" ? `<div class="note wn"><b>Tekshiruv sababi:</b> ${esc(a.why)}</div>` : ""}
  <h2>Kampaniyalari</h2>${s.L.length ? s.L.map(ccard).join("") : empty("📭", "Kampaniya yo‘q")}
  ${au.length ? `<h2>Admin harakatlari</h2><div class="glass">${au.map(arow).join("")}</div>` : ""}
  ${a.st === "act" ? `<button class="btn er w" onclick="flagA(${id})">Shubhali faoliyat tekshiruviga yuborish</button>` : `<button class="btn pri w" onclick="clearA(${id})">Tekshiruvni yakunlash</button>`}`);
}
function flagA(id) { const a = ADVS.find(x => x.id === id); confirmAct({ title: "Tekshiruvga yuborish", text: `<b>${esc(a.n)}</b> shubhali faoliyat tekshiruviga yuboriladi.`, danger: 1, ok: "Yuborish", run: r => { a.st = "chk"; a.why = r; audit("susp", "Reklamachi tekshiruvga yuborildi", a.n, r); advDetail(id); toast("DEMO: tekshiruvga yuborildi"); } }); }
function clearA(id) { const a = ADVS.find(x => x.id === id); confirmAct({ title: "Tekshiruvni yakunlash", text: `<b>${esc(a.n)}</b> hisobi faol holatga qaytariladi.`, ok: "Yakunlash", run: r => { a.st = "act"; a.why = ""; audit("susp", "Tekshiruv yakunlandi", a.n, r); advDetail(id); toast("DEMO: tekshiruv yakunlandi"); } }); }

/* ===== 8. MOLIYA ===== */
const tsum = k => sum(TXS.filter(t => t.k === k && t.st === "ok").map(t => t.a));
const txRow = t => `<div class="tr"><div style="flex:1;min-width:0"><b class="ell" style="font-size:14px">${TT[t.k][0]}</b><div class="g ell" style="font-size:12px">${t.id} · ${esc(t.who)} · ${fd(t.d)}</div></div><div style="text-align:right"><b>${f(t.a)} <span class="g" style="font-size:11px">${TT[t.k][1]}</span></b><div>${bd(TXST, t.st)} ${DEMOB}</div></div></div>`;
function txHtml() {
  const q = S.fq.trim().toLowerCase(), L = TXS.filter(t => (S.ftp === "all" || t.k === S.ftp) && (!q || t.id.toLowerCase().includes(q) || t.who.toLowerCase().includes(q)));
  return L.length ? L.map(txRow).join("") : empty("🧾", "Tranzaksiya topilmadi");
}
const setFT = k => { S.ftp = k; render(); };
function fin() {
  const g = (t, items) => `<h2>${t}</h2><div class="grid2">${items.map(([a, v, u], i) => `<div class="glass stat" style="animation-delay:${i * 60}ms"><div class="g">${a}</div><b class="cn" data-v="${v}">0</b><span>${u}</span></div>`).join("")}</div>`;
  const sp7 = [-6, -5, -4, -3, -2, -1, 0].map(o => sum(TXS.filter(t => t.k === "spend" && t.st === "ok" && t.o === o).map(t => t.a)));
  return `<h1 class="h1">Moliya</h1><div class="note wn">DEMO: haqiqiy moliyaviy operatsiyalar bajarilmaydi. Bu bo‘limda pul yechish, qaytarish yoki ball berish tugmalari ataylab yo‘q.</div>
  ${g("Pul (so‘m)", [["Reklamachilar kiritgan mablag‘lar", tsum("topup"), "so‘m"], ["Kampaniyalarga ajratilgan budjetlar", tsum("reserve"), "so‘m"], ["Amalda sarflangan mablag‘lar", tsum("spend"), "so‘m"], ["Premium to‘lovlari", tsum("prem"), "so‘m"], ["Qaytarilgan to‘lovlar", tsum("refund"), "so‘m"], ["Platforma xarajatlari", tsum("cost"), "so‘m"]])}
  ${g("Ichki ballar (pul emas)", [["Foydalanuvchilarga berilgan ballar", tsum("award"), "ball"], ["Bajarilishi kerak bo‘lgan bonus majburiyatlari", sum(USERS.map(u => u.pts)), "ball"]])}
  ${g("Xizmat majburiyatlari", [["Faol Premium obunalar", USERS.filter(u => u.pr > 0).length, "ta (xizmat ko‘rsatish majburiyati)"]])}
  <div class="note">Bu guruhlar bir-biriga qo‘shilmaydi va sof foyda hisoblanmaydi. Ballar pulga tenglashtirilmagan.</div>
  <h2>Kunlik sarflangan mablag‘ (so‘m)</h2><div class="glass">${chart(sp7, DAYS())}</div>
  <h2>Tranzaksiyalar tarixi</h2><input class="inp" placeholder="Tranzaksiya ID yoki nom" aria-label="Qidirish" value="${esc(S.fq)}" oninput="S.fq=this.value;$('#tx').innerHTML=txHtml()">
  ${chips([["all", "Hammasi"], ...TXK.map(k => [k, TT[k][0]])], S.ftp, "setFT")}<div class="glass" id="tx">${txHtml()}</div>`;
}

/* ===== 9. SOZLAMALAR VA AUDIT ===== */
function sets() {
  const ml = (i, n, fn) => `<div class="ml" onclick="${fn}"><span style="width:28px;text-align:center">${i}</span><span style="flex:1">${n}</span><span class="g">›</span></div>`;
  return `<h1 class="h1">Sozlamalar</h1><div class="note wn">DEMO: backendda sozlamalar endpointlari yo‘q. O‘zgartirishlar serverga saqlanmaydi.</div>
  <div class="glass" style="padding:2px 16px">${Object.entries(SETS).map(([k, v]) => ml("⚙️", v.t, `setPage('${k}')`)).join("")}${ml("👤", "Admin profili", "adminProfile()")}${ml("🛡", "Xavfsizlik va audit jurnali", "auditPg()")}</div><div class="g" style="text-align:center">SPAMLESS ADMIN v1.0.0-demo</div>`;
}
function setPage(k) {
  const d = SETS[k]; S.dr = [...S.set[k]];
  sub(d.t, `<div class="note wn">DEMO: bu sozlama serverda mavjud emas, saqlansa faqat shu sessiyada qoladi.</div><div class="glass">${d.f.map(([n, t], i) => t === "tog" ? `<div class="ml" style="cursor:default"><span style="flex:1">${n}</span><button class="sw ${S.dr[i] ? "on" : ""}" aria-label="${n}" onclick="S.dr[${i}]=!S.dr[${i}];this.classList.toggle('on')"></button></div>`
    : `<label class="lb">${n}</label>${t === "ta" ? `<textarea class="inp ta" maxlength="2000" oninput="S.dr[${i}]=this.value">${esc(S.dr[i])}</textarea>` : `<input class="inp" ${t === "num" ? 'inputmode="numeric"' : 'maxlength="200"'} value="${esc(S.dr[i])}" oninput="S.dr[${i}]=this.value">`}`).join("")}</div>
  <div class="err" id="se"></div><button class="btn pri w" onclick="saveSet('${k}')">Saqlash (DEMO)</button>`);
}
function saveSet(k) {
  const d = SETS[k]; let bad = "";
  d.f.forEach(([n, t], i) => { const v = S.dr[i]; if (t === "num" && !(String(v).trim() !== "" && Number.isInteger(Number(v)) && Number(v) >= 0)) bad = n + ": butun musbat son kiriting"; if ((t === "text" || t === "ta") && !String(v).trim()) bad = n + ": bo‘sh bo‘lmasin"; });
  if (bad) { $("#se").textContent = bad; hap("error"); return; }
  const ch = d.f.map((x, i) => String(S.dr[i]) !== String(S.set[k][i]) ? x[0] : null).filter(Boolean);
  if (!ch.length) { toast("O‘zgarish yo‘q"); return; }
  confirmAct({ title: "Sozlamani saqlash", text: "O‘zgargan maydonlar: " + esc(ch.join(", ")), ok: "Saqlash", run: r => { S.set[k] = d.f.map((x, i) => x[1] === "num" ? Number(S.dr[i]) : S.dr[i]); audit("admin", "Sozlama o‘zgartirildi (DEMO): " + d.t, ch.join(", "), r); closeLy(); render(); toast("DEMO: sozlama faqat shu sessiyada saqlandi"); } });
}
function adminProfile() { const w = who(); sub("Admin profili", `${kv([["Ism", esc(w.n)], ["Username", w.u ? "@" + esc(w.u) : "—"], ["Telegram ID", esc(w.id)], ["Rol", "Administrator"], ["Huquq holati", w.v ? "Serverda tasdiqlangan" : "Tasdiqlanmagan (prototip)"]])}<div class="note ${SRV.st === "ok" ? "" : "wn"}">${esc(SRV.msg)}. Admin huquqi faqat backend (ADMIN_IDS) tomonidan beriladi.</div>`); }
const arow = a => `<div class="kv" style="display:block"><b>${esc(a.act)}</b> ${DEMOB}<div class="g" style="font-size:12px">${esc(a.tgt)} · ${esc(a.w)} · ${fd(a.t)} ${ft(a.t)}</div>${a.why && a.why !== "—" ? `<div style="font-size:13px">Sabab: ${esc(a.why)}</div>` : ""}</div>`;
const audTab = k => { S.atab = k; auditPg(); };
function auditPg() {
  const L = S.aud.filter(a => S.atab === "admin" ? ["admin", "block", "ad", "susp"].includes(a.cat) : a.cat === S.atab);
  sub("Xavfsizlik va audit jurnali", `<div class="note wn">DEMO: haqiqiy audit jurnali serverda (AuditLog jadvali) yozilishi kerak. Bu yerdagi yozuvlar faqat shu sessiyada.</div>${chips(AUDT, S.atab, "audTab")}<div class="glass">${L.length ? L.map(arow).join("") : empty("🗂", "Yozuv yo‘q")}</div>`);
}

/* ===== 10. NAVIGATSIYA ===== */
const IC = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 4.5a3.5 3.5 0 010 7M18.5 14.6c1.6.6 2.7 2.4 3 5"/>',
  ads: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1zM15 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/>',
  fin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8m0 8v1.5"/>',
  sets: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
};
const NAV = [["dash", "Dashboard"], ["users", "Foydalanuvchilar"], ["ads", "Reklamalar"], ["fin", "Moliya"], ["sets", "Sozlamalar"]];
const PG = { dash, users, ads, fin, sets };
function nav() { $("#nav").innerHTML = NAV.map(([k, n]) => `<button class="${S.tab === k ? "on" : ""}" onclick="go('${k}')" aria-label="${n}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${n}</button>`).join(""); }
function render() {
  if (!(SRV.st === "ok" || (S.demo && SRV.st !== "denied"))) { gate(); return; }
  $("nav").style.display = ""; $("#view").innerHTML = hdr() + `<div class="view">${PG[S.tab]()}</div>`; nav(); counters();
}
function go(k) { S.tab = k; closeLy(); closeMd(); render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("button")) hap(); });
$("#view").innerHTML = '<div class="sk"></div><div class="sk" style="height:130px"></div><div class="sk"></div>'; $("nav").style.display = "none";
boot().finally(() => setTimeout(render, 350));
</script>
</body>
